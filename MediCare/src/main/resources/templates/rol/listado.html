<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{general/fragmentos :: head}">
        <title>Gestión de roles</title>
    </head>

    <body class="bg-light">

        <header th:replace="~{general/fragmentos :: navbar}">
        </header>

        <main class="container py-5">

            <div class="d-flex justify-content-between
                        align-items-center mb-4">

                <div>
                    <h1 class="h2 mb-1">Gestión de roles</h1>

                    <p class="text-muted mb-0">
                        Administre los roles disponibles en MediCare.
                    </p>
                </div>

                <a th:href="@{/roles/nuevo}"
                   class="btn btn-primary">
                    Agregar rol
                </a>

            </div>

            <div th:if="${#lists.isEmpty(roles)}"
                 class="alert alert-info">

                No hay roles registrados.

            </div>

            <div th:unless="${#lists.isEmpty(roles)}"
                 class="card border-0 shadow-sm">

                <div class="card-body p-0">

                    <div class="table-responsive">

                        <table class="table table-hover
                                      align-middle mb-0">

                            <thead class="table-primary">
                                <tr>
                                    <th class="ps-4">ID</th>
                                    <th>Nombre del rol</th>
                                    <th class="text-center">
                                        Acciones
                                    </th>
                                </tr>
                            </thead>

                            <tbody>

                                <tr th:each="rol : ${roles}">

                                    <td class="ps-4"
                                        th:text="${rol.id}">
                                        1
                                    </td>

                                    <td th:text="${rol.nombre}">
                                        ADMIN
                                    </td>

                                    <td class="text-center">

                                        <a th:href="@{/roles/detalle/{id}
                                           (id=${rol.id})}"
                                           class="btn btn-info
                                                  btn-sm text-white">
                                            Detalle
                                        </a>

                                        <a th:href="@{/roles/editar/{id}
                                           (id=${rol.id})}"
                                           class="btn btn-warning btn-sm">
                                            Editar
                                        </a>

                                        <a th:href="@{/roles/eliminar/{id}
                                           (id=${rol.id})}"
                                           class="btn btn-danger btn-sm"
                                           onclick="return confirm(
                                           '¿Desea eliminar este rol?'
                                           );">
                                            Eliminar
                                        </a>

                                    </td>

                                </tr>

                            </tbody>
                        </table>

                    </div>
                </div>
            </div>

            <div class="mt-4">
                <a th:href="@{/}"
                   class="btn btn-outline-secondary">
                    Volver al inicio
                </a>
            </div>

        </main>

        <footer th:replace="~{general/fragmentos :: footer}">
        </footer>

    </body>
</html>
