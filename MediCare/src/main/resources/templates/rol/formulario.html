<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{general/fragmentos :: head}">
        <title>Formulario de rol</title>
    </head>

    <body class="bg-light">

        <header th:replace="~{general/fragmentos :: navbar}">
        </header>

        <main class="container py-5">

            <div class="row justify-content-center">

                <div class="col-md-7 col-lg-6">

                    <div class="card border-0 shadow-sm">

                        <div class="card-header bg-primary text-white py-3">

                            <h1 class="h4 mb-0"
                                th:text="${rol.id == null}
                                ? 'Agregar rol'
                                : 'Editar rol'">
                                Formulario de rol
                            </h1>

                        </div>

                        <div class="card-body p-4">

                            <form th:action="@{/roles/guardar}"
                                  th:object="${rol}"
                                  method="post">

                                <input type="hidden"
                                       th:field="*{id}">

                                <div class="mb-4">

                                    <label for="nombre"
                                           class="form-label">
                                        Nombre del rol
                                    </label>

                                    <input type="text"
                                           id="nombre"
                                           th:field="*{nombre}"
                                           class="form-control"
                                           placeholder="Ejemplo: RECEPCIONISTA"
                                           maxlength="100"
                                           required>

                                    <div class="form-text">
                                        El nombre debe ser único.
                                    </div>

                                </div>

                                <div class="d-flex gap-2">

                                    <button type="submit"
                                            class="btn btn-primary">
                                        Guardar
                                    </button>

                                    <a th:href="@{/roles}"
                                       class="btn btn-outline-secondary">
                                        Cancelar
                                    </a>

                                </div>

                            </form>

                        </div>
                    </div>
                </div>
            </div>

        </main>

        <footer th:replace="~{general/fragmentos :: footer}">
        </footer>

    </body>
</html>
