<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <head th:fragment="head">
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, initial-scale=1.0">

        <title>MediCare</title>

        <link th:href="@{/webjars/bootstrap/5.3.7/css/bootstrap.min.css}"
              rel="stylesheet">
    </head>

    <body>

        <nav th:fragment="navbar"
             class="navbar navbar-expand-lg navbar-dark bg-primary">

            <div class="container">

                <a class="navbar-brand fw-bold" th:href="@{/}">
                    MediCare
                </a>

                <button class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#menuPrincipal"
                        aria-controls="menuPrincipal"
                        aria-expanded="false"
                        aria-label="Mostrar navegación">

                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse"
                     id="menuPrincipal">

                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/}">
                                Inicio
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/usuarios}">
                                Usuarios
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/roles}">
                                Roles
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/citas}">
                                Citas médicas
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/consultas}">
                                Consultas
                            </a>
                        </li>

                    </ul>

                    <form th:action="@{/logout}" method="post">
                        <button type="submit"
                                class="btn btn-outline-light">
                            Cerrar sesión
                        </button>
                    </form>

                </div>
            </div>
        </nav>

        <footer th:fragment="footer"
                class="bg-dark text-white text-center py-3 mt-5">

            <div class="container">
                <p class="mb-0">
                    MediCare - Plataforma de servicios de salud
                </p>
            </div>

            <script th:src="@{/webjars/bootstrap/5.3.7/js/bootstrap.bundle.min.js}">
            </script>
        </footer>

    </body>
</html>
