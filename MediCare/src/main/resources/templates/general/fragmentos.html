<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <head th:fragment="head">

        <meta charset="UTF-8">

        <meta name="viewport"
              content="width=device-width, initial-scale=1.0">

        <title>MediCare</title>

        <link th:href="@{/webjars/bootstrap/5.3.7/css/bootstrap.min.css}"
              rel="stylesheet">

        <link th:href="@{/css/estilos.css}"
              rel="stylesheet">

    </head>

    <body>

        <aside th:fragment="navbar"
               class="medicare-sidebar">

            <a th:href="@{/}"
               class="sidebar-brand"
               title="MediCare">
                MC
            </a>

            <nav class="sidebar-menu">

                <a th:href="@{/}"
                   class="sidebar-link"
                   title="Inicio">

                    <span class="sidebar-symbol">IN</span>
                    <span class="sidebar-label">Inicio</span>

                </a>

                <a th:href="@{/usuarios}"
                   class="sidebar-link"
                   title="Usuarios"
                   sec:authorize="hasRole('ADMIN')">

                    <span class="sidebar-symbol">US</span>
                    <span class="sidebar-label">Usuarios</span>

                </a>

                <a th:href="@{/roles}"
                   class="sidebar-link"
                   title="Roles"
                   sec:authorize="hasRole('ADMIN')">

                    <span class="sidebar-symbol">RO</span>
                    <span class="sidebar-label">Roles</span>

                </a>

                <a th:href="@{/citas}"
                   class="sidebar-link"
                   title="Citas médicas"
                   sec:authorize="hasAnyRole(
                   'ADMIN', 'MEDICO', 'PACIENTE')">

                    <span class="sidebar-symbol">CI</span>
                    <span class="sidebar-label">Citas</span>

                </a>

                <a th:href="@{/consultas}"
                   class="sidebar-link"
                   title="Consultas avanzadas"
                   sec:authorize="hasAnyRole(
                   'ADMIN', 'MEDICO', 'PACIENTE')">

                    <span class="sidebar-symbol">CO</span>
                    <span class="sidebar-label">Consultas</span>

                </a>

            </nav>

            <div class="sidebar-account"
                 sec:authorize="isAuthenticated()">

                <span class="sidebar-user"
                      sec:authentication="name"
                      title="Usuario autenticado">
                    usuario@medicare.com
                </span>

                <form th:action="@{/logout}"
                      method="post">

                    <button type="submit"
                            class="sidebar-logout"
                            title="Cerrar sesión">
                        SALIR
                    </button>

                </form>

            </div>

        </aside>

        <footer th:fragment="footer"
                class="medicare-footer text-center py-4">

            <div class="container">

                <p class="mb-0">
                    MediCare · Plataforma de servicios de salud
                </p>

            </div>

            <script th:src="@{/webjars/bootstrap/5.3.7/js/bootstrap.bundle.min.js}">
            </script>

        </footer>

    </body>
</html>
