<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{general/fragmentos :: head}">
        <title>Gestión de usuarios</title>
    </head>

    <body class="bg-light">

        <header th:replace="~{general/fragmentos :: navbar}">
        </header>

        <main class="container py-5">

            <div class="d-flex justify-content-between
                        align-items-center mb-4">

                <div>
                    <h1 class="h2 mb-1">
                        Gestión de usuarios
                    </h1>

                    <p class="text-muted mb-0">
                        Administre los usuarios registrados
                        en MediCare.
                    </p>
                </div>

                <a th:href="@{/usuarios/nuevo}"
                   class="btn btn-primary">
                    Agregar usuario
                </a>

            </div>

            <div th:if="${#lists.isEmpty(usuarios)}"
                 class="alert alert-info">

                No hay usuarios registrados.

            </div>

            <div th:unless="${#lists.isEmpty(usuarios)}"
                 class="card border-0 shadow-sm">

                <div class="card-body p-0">

                    <div class="table-responsive">

                        <table class="table table-hover
                                      align-middle mb-0">

                            <thead class="table-primary">
                                <tr>
                                    <th class="ps-4">ID</th>
                                    <th>Nombre</th>
                                    <th>Correo electrónico</th>
                                    <th>Rol</th>
                                    <th>Estado</th>
                                    <th class="text-center">
                                        Acciones
                                    </th>
                                </tr>
                            </thead>

                            <tbody>

                                <tr th:each="usuario : ${usuarios}">

                                    <td class="ps-4"
                                        th:text="${usuario.id}">
                                        1
                                    </td>

                                    <td th:text="${usuario.nombre}">
                                        Admin General
                                    </td>

                                    <td th:text="${usuario.email}">
                                        admin@medicare.com
                                    </td>

                                    <td>
                                        <span class="badge bg-secondary"
                                              th:text="${usuario.rol.nombre}">
                                            ADMIN
                                        </span>
                                    </td>

                                    <td>

                                        <span th:if="${usuario.activo}"
                                              class="badge bg-success">
                                            Activo
                                        </span>

                                        <span th:unless="${usuario.activo}"
                                              class="badge bg-danger">
                                            Inactivo
                                        </span>

                                    </td>

                                    <td class="text-center">

                                        <a th:href="@{/usuarios/detalle/{id}
                                           (id=${usuario.id})}"
                                           class="btn btn-info
                                                  btn-sm text-white">
                                            Detalle
                                        </a>

                                        <a th:href="@{/usuarios/editar/{id}
                                           (id=${usuario.id})}"
                                           class="btn btn-warning btn-sm">
                                            Editar
                                        </a>

                                        <a th:href="@{/usuarios/eliminar/{id}
                                           (id=${usuario.id})}"
                                           class="btn btn-danger btn-sm"
                                           onclick="return confirm(
                                           '¿Desea eliminar este usuario?'
                                           );">
                                            Eliminar
                                        </a>

                                    </td>
                                </tr>

                            </tbody>
                        </table>

                    </div>
                </div>
            </div>

            <div class="mt-4">

                <a th:href="@{/}"
                   class="btn btn-outline-secondary">
                    Volver al inicio
                </a>

            </div>

        </main>

        <footer th:replace="~{general/fragmentos :: footer}">
        </footer>

    </body>
</html>
